name: Build native test desktop apps

on:
  push:
    branches: [test-package-20261004]
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub Release after all native builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Native build — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2022
          - name: macOS-arm64
            os: macos-15
          - name: macOS-Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build standalone applications
        run: python packaging/build_native.py
      - name: Store native packages and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.zip
            release/*.sha256
            release/gui-qa/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

